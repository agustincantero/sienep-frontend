// Genera una fecha relativa a "hoy" (en días) para que la demo de recordatorios
// siempre muestre una mezcla realista de vencidos/de hoy/futuros, sin importar
// cuándo se abra el prototipo. Devuelve formato datetime-local ("YYYY-MM-DDTHH:mm").
function fechaRelativa(diasDesdeHoy, hora, minuto) {
  const d = new Date();
  d.setDate(d.getDate() + diasDesdeHoy);
  d.setHours(hora, minuto, 0, 0);
  const pad = (n) => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
// A partir de un datetime-local, arma el texto "DD/MM HH:mm" que usa el resto de la app.
function formatearFechaHora(iso) {
  if (!iso) return "—";
  const d = new Date(iso);
  const pad = (n) => String(n).padStart(2, "0");
  return `${pad(d.getDate())}/${pad(d.getMonth() + 1)} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
// Estado OPERATIVO de un recordatorio (separado del estado lógico activo/inactivo):
// se calcula según la fecha, no se guarda — igual que "estadoOperativo" en la API real.
function estadoOperativoDe(iso) {
  const fecha = new Date(iso);
  const hoy = new Date();
  const soloFecha = (d) => new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
  if (soloFecha(fecha) < soloFecha(hoy)) return "vencido";
  if (soloFecha(fecha) === soloFecha(hoy)) return "hoy";
  return "futuro";
}

// Nadie puede asignarle a otro un rol con permisos que él mismo no tiene, ni
// otorgar en un rol un permiso propio que no posee — mismo criterio que
// ValidadorDePermisosDeRol/H20 en el backend real. "ALL" (el actor es
// ADMINISTRADOR) puede asignar cualquier cosa; nadie más puede asignar ADMINISTRADOR.
function puedeAsignarRol(rolDestino, misPermisos) {
  if (misPermisos === "ALL") return true;
  if (rolDestino.permisos === "ALL") return false;
  return rolDestino.permisos.every((p) => misPermisos.includes(p));
}

// Carrera tiene uno o más ITRs asociados, y Grupo pertenece a una única
// Carrera — es la jerarquía real (Grupo → Carrera → ITRs), no 3 listas sueltas.
// Instancia y Recordatorio tienen cada uno su PROPIO catálogo de categorías,
// son catálogos distintos aunque algunos nombres se parezcan.
const CATALOGOS = {
  Carreras: [
    { nombre: "Ing. en Sistemas", estado: "activo" },
    { nombre: "Ing. Mecatrónica", estado: "activo" },
    { nombre: "Analista en TI", estado: "activo" },

    { nombre: "3C", carrera: "Analista en TI", generacion: 2023, estado: "activo" },
  ],
  // La relación es ITR -> Carreras (así la modela la API: el ITR elige qué
  // carreras dicta, no al revés), por eso "carreras" vive acá y no en Carreras.
  ITRs: [

    { nombre: "Otro", descripcion: "Cualquier otro tipo de recordatorio.", estado: "activo" },
  ],
};

// Deriva la(s) carrera(s) de un estudiante a partir de sus grupos — la carrera
// nunca es un dato propio del estudiante, sale de a qué grupo(s) pertenece.
function carrerasDe(nombresDeGrupos) {
  const nombres = nombresDeGrupos
    .map((g) => {
      const grupo = CATALOGOS.Grupos.find((x) => x.nombre === g);
      return grupo ? grupo.carrera : null;
    })
    .filter(Boolean);
  return [...new Set(nombres)];
}

// La dirección se guarda en 4 partes (calle, número de puerta, ciudad/barrio,
// departamento) — esto arma el texto legible a partir de esas partes.
function formatearDireccion(d) {
  if (!d) return "—";
  return [d.calle && d.nroPuerta ? `${d.calle} ${d.nroPuerta}` : d.calle, d.ciudad, d.departamento].filter(Boolean).join(", ") || "—";
}

function RestablecerContraseniaScreen({ onDone }) {
  const [nueva, setNueva] = useState("");
  const [confirmar, setConfirmar] = useState("");
  const [error, setError] = useState("");

  function handleSubmit(e) {
    e.preventDefault();
    if (nueva.length < 8) {
      setError("La contraseña tiene que tener al menos 8 caracteres.");
      return;
    }
    if (nueva !== confirmar) {
      setError("Las contraseñas no coinciden.");
      return;
    }
    setError("");
    onDone();
  }

  return h(
    "div",
    { className: "min-h-screen flex flex-col bg-primary" },
    h(
      "main",
      { className: "flex-1 flex items-center justify-center px-4 py-10" },

        "div",

        h(

          h("div", { className: "px-6 pt-6" }, h("h3", { className: "text-center font-light text-3xl my-4" }, "Restablecer contraseña")),
          h(
            "div",
            { className: "card-body pt-2" },
            h("div", { className: "text-sm mb-3 text-base-content/60" }, "Ingresá tu nueva contraseña. Este enlace vence a los 30 minutos o al usarlo por primera vez."),
            error ? h("div", { className: "alert alert-error text-sm mb-3", role: "alert" }, error) : null,
            h(
              "form",
              { onSubmit: handleSubmit, className: "space-y-4" },
              h(
                "label",
                { className: "floating-label" },
                h("span", null, "Nueva contraseña"),
                h("input", { className: "input w-full border-neutral-800/30", type: "password", placeholder: "Nueva contraseña", value: nueva, onChange: (e) => setNueva(e.target.value) })
              ),
              h(
                "label",
                { className: "floating-label" },
                h("span", null, "Confirmar contraseña"),
                h("input", { className: "input w-full border-neutral-800/30", type: "password", placeholder: "Confirmar contraseña", value: confirmar, onChange: (e) => setConfirmar(e.target.value) })

              h("button", { type: "submit", className: "btn btn-primary w-full mt-2" }, "Guardar nueva contraseña")

function ArchivosYComentarios({ estudiante, puedeVerConfidencial, onUpdate }) {
  const s = estudiante;
  const [comentarioTexto, setComentarioTexto] = useState("");
  const [comentarioConfTexto, setComentarioConfTexto] = useState("");
  const [informeNombre, setInformeNombre] = useState("");
  const [informeArchivo, setInformeArchivo] = useState(null);

  function hoy() {
    const d = new Date();
    const pad = (n) => String(n).padStart(2, "0");
    return `${pad(d.getDate())}/${pad(d.getMonth() + 1)}`;
  }
  function descargar(informe) {
    const blob = informe.archivo instanceof Blob ? informe.archivo : new Blob([`Contenido simulado de ${informe.nombre} (prototipo, sin backend real).`], { type: "text/plain" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = informe.nombre;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }
  function agregarComentario(e) {
    e.preventDefault();
    if (!comentarioTexto.trim()) return;
    onUpdate({ ...s, comentarios: s.comentarios.concat({ autor: "Vos", fecha: hoy(), texto: comentarioTexto.trim() }) });
    setComentarioTexto("");
  }
  function agregarComentarioConfidencial(e) {
    e.preventDefault();
    if (!comentarioConfTexto.trim()) return;
    onUpdate({ ...s, comentariosConfidenciales: s.comentariosConfidenciales.concat({ autor: "Vos", fecha: hoy(), texto: comentarioConfTexto.trim() }) });
    setComentarioConfTexto("");
  }
  function subirInforme(e) {
    e.preventDefault();
    if (!informeNombre.trim() || !informeArchivo) return;
    onUpdate({ ...s, informes: s.informes.concat({ nombre: informeNombre.trim(), autor: "Vos", fecha: hoy(), archivo: informeArchivo }) });
    setInformeNombre("");
    setInformeArchivo(null);
  }

  return h(
    "div",
    { className: "grid grid-cols-12 gap-4" },
    h(
      "div",
      { className: "col-span-12 lg:col-span-6" },
      h("h6", { className: "font-bold mb-2" }, "Informes adjuntos"),
      s.informes.length
        ? h(
            "ul",
            { className: "divide-y divide-base-300 mb-3" },
            s.informes.map((f, i) =>
              h(
                "li",
                { className: "py-2 flex items-center justify-between", key: i },
                h(
                  "span",
                  { className: "flex items-center gap-2" },
                  h(Icon, { path: ICONS.fileEarmark, size: 15 }),
                  h("span", null, f.nombre, h("span", { className: "text-base-content/60 text-sm" }, ` — ${f.autor}, ${f.fecha}`))
                ),
                h("button", { type: "button", className: "btn btn-link btn-sm p-0 no-underline", onClick: () => descargar(f) }, "Descargar")
              )
            )
          )
        : h("p", { className: "text-base-content/60 text-sm" }, "Sin informes adjuntos."),
      h(
        "form",
        { onSubmit: subirInforme, className: "border-t border-base-300 pt-3" },
        h("input", { className: "input input-bordered input-sm w-full mb-2 border-neutral-800/30", placeholder: "Nombre del informe", value: informeNombre, onChange: (e) => setInformeNombre(e.target.value) }),
        h("input", {
          type: "file",
          accept: ".pdf,.jpg,.jpeg,.png",
          className: "file-input file-input-bordered file-input-sm w-full mb-2",
          onChange: (e) => setInformeArchivo(e.target.files[0] || null),
        }),
        h("div", { className: "text-xs text-base-content/60 mb-2" }, "PDF, JPG o PNG, máx. 5MB."),
        h("button", { type: "submit", className: "btn btn-outline btn-primary btn-sm" }, "Subir informe")
      )
    ),
    h(
      "div",
      { className: "col-span-12 lg:col-span-6" },
      h("h6", { className: "font-bold mb-2" }, "Comentarios"),
      h(ComentariosBox, { comentarios: s.comentarios, onAdd: (c) => onUpdate({ ...s, comentarios: s.comentarios.concat(c) }) }),
      h("h6", { className: "font-bold mb-2 mt-4" }, "Comentarios confidenciales"),
      puedeVerConfidencial
        ? h(ComentariosBox, { comentarios: s.comentariosConfidenciales, onAdd: (c) => onUpdate({ ...s, comentariosConfidenciales: s.comentariosConfidenciales.concat(c) }) })
        : h(
            "div",
            { className: "alert alert-warning text-sm flex items-center gap-2", role: "alert" },
            h(Icon, { path: ICONS.shield, size: 16 }),
            "Esta información solo la ven funcionarios con el permiso VER_BLOQUE_CONFIDENCIAL."
          )
    )
  );
}

function EstudiantesSection({ misPermisos }) {
  const [students, setStudents] = useState(STUDENTS);
  const [texto, setTexto] = useState("");
  const [ficha, setFicha] = useState(null);
  const [nuevo, setNuevo] = useState(false);
  const [editarDoc, setEditarDoc] = useState(null);

  if (nuevo)
    return h(NuevoEstudianteForm, {
      onCancel: () => setNuevo(false),
      onSave: (s) => {
        setStudents(students.concat(s));
        setNuevo(false);
      },
    });

  if (editarDoc) {
    const actual = students.find((s) => s.doc === editarDoc);
    return h(EditarEstudianteForm, {
      estudiante: actual,
      onCancel: () => setEditarDoc(null),
      onSave: (updated) => {
        setStudents(students.map((s) => (s.doc === editarDoc ? updated : s)));
        setEditarDoc(null);
      },
    });
  }

  if (ficha) {
    const actual = students.find((s) => s.doc === ficha);
    return h(FichaEstudiante, {
      estudiante: actual,
      misPermisos,
      onBack: () => setFicha(null),
      onUpdate: (updated) => setStudents(students.map((s) => (s.doc === actual.doc ? updated : s))),
    });
  }

  const filtrados = students.filter((s) => {
    if (!texto) return true;
    const q = texto.toLowerCase();
    return s.nombre.toLowerCase().includes(q) || s.doc.includes(q);
  });

  return h(
    "div",
    { className: "w-full px-4 py-4 max-w-[1040px]" },
    h(SectionHeader, { title: "Estudiantes", action: "+ Nuevo estudiante", onAction: () => setNuevo(true) }),
    h(
      "div",
      { className: "grid grid-cols-12 gap-2 mb-3" },
      h(
        "div",
        { className: "col-span-12 md:col-span-4" },
        h(
          "div",
          { className: "relative" },
          h("span", { className: "absolute left-3 top-1/2 -translate-y-1/2 text-base-content/50 pointer-events-none" }, h(Icon, { path: ICONS.search, size: 14 })),
          h("input", { className: "input input-bordered input-sm w-full pl-9 border-neutral-800/30", placeholder: "Buscar por nombre, apellido o documento", value: texto, onChange: (e) => setTexto(e.target.value) })
        )
      ),
      h("div", { className: "col-span-6 md:col-span-2" }, h("select", { className: "select select-bordered select-sm w-full border-neutral-800/30" }, h("option", null, "Grupo (todos)"))),
      h("div", { className: "col-span-6 md:col-span-3" }, h("select", { className: "select select-bordered select-sm w-full border-neutral-800/30" }, h("option", null, "Carrera (todas)"))),
      h("div", { className: "col-span-6 md:col-span-2" }, h("select", { className: "select select-bordered select-sm w-full border-neutral-800/30" }, h("option", null, "Estado: Activos")))
    ),
    h(DataTable, {
      headers: ["Estudiante", "Documento", "Grupo", "Carrera", "Estado", ""],
      rows: filtrados.map((s) =>
        h(
          "tr",
          { key: s.doc },
          h("td", { className: "font-semibold" }, s.nombre),

          h("td", null, h("span", { className: "badge " + ESTADO_BADGE[s.estado] }, ESTADO_LABEL[s.estado])),

/* ---------------- Roles y permisos ---------------- */
function RolForm({ rol, onCancel, onSave, misPermisos }) {
  const [nombre, setNombre] = useState(rol ? rol.nombre : "");
  const [descripcion, setDescripcion] = useState(rol ? rol.descripcion : "");
  const [permisos, setPermisos] = useState(rol && Array.isArray(rol.permisos) ? rol.permisos : []);

  function tengoPermiso(p) {
    return misPermisos === "ALL" || misPermisos.includes(p);
  }
  // Un permiso que vos no tenés pero que el rol YA tenía se puede sacar (así se
  // arregla un rol sobre-privilegiado), simplemente no se puede volver a agregar
  // — mismo resultado que RolService.editar() en el backend real, que valida el
  // conjunto FINAL de permisos activos contra el actor, no el estado previo.
  function toggle(p) {
    const yaLoTenia = permisos.includes(p);
    if (!yaLoTenia && !tengoPermiso(p)) return;
    setPermisos(yaLoTenia ? permisos.filter((x) => x !== p) : permisos.concat(p));
  }
  function handleSubmit(e) {
    e.preventDefault();
    onSave({ nombre: nombre.toUpperCase().trim().replace(/\s+/g, "_"), descripcion, permisos, estado: rol ? rol.estado : "activo" });
  }

  return h(
    "form",
    { onSubmit: handleSubmit, className: "max-w-[700px] mx-auto w-full px-4 py-4" },
    h(BackButton, { onClick: onCancel, label: "Cancelar" }),
    h("h1", { className: "text-xl font-bold mb-1" }, rol ? "Editar rol" : "Nuevo rol"),
    h("p", { className: "text-base-content/60 text-sm mb-4" }, "No podés otorgar en un rol un permiso que vos mismo no tenés, por eso algunos quedan bloqueados."),
    h(
      "div",
      { className: "grid grid-cols-12 gap-3" },
      h("div", { className: "col-span-12 md:col-span-6" }, h("label", { className: "block text-sm font-medium mb-1" }, "Nombre *"), h("input", { className: "input input-bordered w-full border-neutral-800/30", required: true, value: nombre, onChange: (e) => setNombre(e.target.value) })),
      h(
        "div",
        { className: "col-span-12 md:col-span-6" },
        h("label", { className: "block text-sm font-medium mb-1" }, "Descripción"),
        h("input", { className: "input input-bordered w-full border-neutral-800/30", value: descripcion, onChange: (e) => setDescripcion(e.target.value) })
      )
    ),
    h(FieldSetLabel, null, "Permisos"),
    Object.entries(PERMISOS_CATALOGO).map(([categoria, permisosDeCategoria]) =>
      h(
        "div",
        { className: "mb-3", key: categoria },
        h("div", { className: "font-semibold text-sm mb-1" }, categoria),
        h(
          "div",
          { className: "flex flex-wrap gap-3" },
          permisosDeCategoria.map((p) =>
            h(
              "div",
              { className: "flex items-center gap-2", key: p },
              h("input", {
                type: "checkbox",
                className: "checkbox checkbox-sm",
                id: "perm-" + p,
                checked: permisos.includes(p),
                disabled: !permisos.includes(p) && !tengoPermiso(p),
                onChange: () => toggle(p),
              }),
              h(
                "label",
                {
                  className: "text-sm font-mono" + (tengoPermiso(p) ? "" : " text-base-content/60"),
                  htmlFor: "perm-" + p,
                  title: tengoPermiso(p) ? "" : permisos.includes(p) ? "No tenés este permiso, lo podés sacar, pero no volver a agregar" : "No tenés este permiso",
                },
                p
              )
            )
          )
        )
      )
    ),
    h(
      "div",
      { className: "flex gap-2 justify-end border-t border-base-300 pt-3 mt-4" },
      h("button", { type: "button", className: "btn btn-outline", onClick: onCancel }, "Cancelar"),
      h("button", { type: "submit", className: "btn btn-primary" }, rol ? "Guardar cambios" : "Crear rol")

/* ---------------- Catálogos ---------------- */
// Carreras y Grupos son objetos con relación ({nombre, itrs}/{nombre, carrera}),
// ITRs y las dos Categorías siguen siendo listas simples de texto — por eso el
// formulario de alta/edición cambia de forma según qué pestaña está activa.
function CatalogosSection() {
  const [catalogos, setCatalogos] = useState(CATALOGOS);
  const nombres = Object.keys(catalogos);
  const [tab, setTab] = useState(nombres[0]);
  const formVacio = { nombre: "", carrera: catalogos.Carreras[0] ? catalogos.Carreras[0].nombre : "", generacion: new Date().getFullYear(), carreras: [], descripcion: "" };
  const [form, setForm] = useState(formVacio);
  const [editIndex, setEditIndex] = useState(null);
  const [editForm, setEditForm] = useState(formVacio);

  const items = catalogos[tab];
  const esCarreras = tab === "Carreras";
  const esGrupos = tab === "Grupos";
  const esItrs = tab === "ITRs";
  const esSimple = !esCarreras && !esGrupos && !esItrs; // Categorías de instancia / de recordatorio

  function cambiarTab(n) {
    setTab(n);
    setEditIndex(null);
    setForm({ ...formVacio, carrera: catalogos.Carreras[0] ? catalogos.Carreras[0].nombre : "" });
  }
  function actualizarLista(nuevaLista) {
    setCatalogos({ ...catalogos, [tab]: nuevaLista });
  }
  function toggleEnLista(setter, actual, campo, valor) {
    const lista = actual[campo] || [];
    setter({ ...actual, [campo]: lista.includes(valor) ? lista.filter((x) => x !== valor) : lista.concat(valor) });
  }
  // Carreras que un ITR dicta (ITR -> Carreras, no al revés, como en la API real).
  function carrerasDeEsteItr(nombreItr) {
    const itr = catalogos.ITRs.find((x) => x.nombre === nombreItr);
    return itr ? itr.carreras : [];
  }
  function itrsQueDictanEstaCarrera(nombreCarrera) {
    return catalogos.ITRs.filter((itr) => itr.carreras.includes(nombreCarrera)).map((itr) => itr.nombre);
  }

  function agregar(e) {
    e.preventDefault();
    if (!form.nombre.trim()) return;
    if (esGrupos) actualizarLista(items.concat({ nombre: form.nombre.trim(), carrera: form.carrera, generacion: Number(form.generacion), estado: "activo" }));
    else if (esItrs) actualizarLista(items.concat({ nombre: form.nombre.trim(), carreras: form.carreras, estado: "activo" }));
    else if (esCarreras) actualizarLista(items.concat({ nombre: form.nombre.trim(), estado: "activo" }));
    else actualizarLista(items.concat({ nombre: form.nombre.trim(), descripcion: form.descripcion.trim(), estado: "activo" }));
    setForm({ ...formVacio, carrera: catalogos.Carreras[0] ? catalogos.Carreras[0].nombre : "" });
  }
  function empezarEdicion(i) {
    setEditIndex(i);
    setEditForm({ ...formVacio, ...items[i] });
  }
  function guardarEdicion(i) {
    const copia = items.slice();
    copia[i] = esGrupos
      ? { ...copia[i], nombre: editForm.nombre, generacion: Number(editForm.generacion) } // GrupoUpdateDTO no permite cambiar de carrera
      : esItrs
      ? { ...copia[i], nombre: editForm.nombre, carreras: editForm.carreras || [] }
      : esCarreras
      ? { ...copia[i], nombre: editForm.nombre }
      : { ...copia[i], nombre: editForm.nombre, descripcion: editForm.descripcion };
    actualizarLista(copia);
    setEditIndex(null);
  }
  function toggleEstadoItem(i) {
    const copia = items.slice();
    copia[i] = { ...copia[i], estado: copia[i].estado === "activo" ? "inactivo" : "activo" };
    actualizarLista(copia);
  }

  return h(
    "div",
    { className: "w-full px-4 py-4 max-w-[900px]" },
    h(SectionHeader, { title: "Catálogos" }),
    h(
      "div",
      { className: "tabs tabs-border mb-3", role: "tablist" },
      nombres.map((n) => h("button", { type: "button", role: "tab", className: "tab" + (tab === n ? " tab-active" : ""), key: n, onClick: () => cambiarTab(n) }, n))
    ),
    h(DataTable, {
      headers: ["Nombre", "Detalle", "Estado", ""],
      rows: items.map((item, i) => {
        const esEdit = editIndex === i;
        return h(
          "tr",
          { key: i },
          h(
            "td",
            { className: "font-semibold" },
            esEdit
              ? h("input", { className: "input input-bordered input-sm w-full border-neutral-800/30", value: editForm.nombre || "", onChange: (e) => setEditForm({ ...editForm, nombre: e.target.value }), autoFocus: true })
              : item.nombre
          ),
          h(
            "td",
            null,
            esEdit
              ? h(
                  Fragment,
                  null,
                  esGrupos
                    ? h(
                        Fragment,
                        null,
                        h("div", { className: "text-base-content/60 text-sm mb-1" }, "Carrera: " + item.carrera + " (no editable)"),
                        h("input", {
                          type: "number",
                          className: "input input-bordered input-sm w-32 border-neutral-800/30",
                          placeholder: "Generación",
                          value: editForm.generacion,
                          onChange: (e) => setEditForm({ ...editForm, generacion: e.target.value }),
                        })
                      )
                    : null,
                  esItrs
                    ? h(
                        "div",
                        { className: "flex flex-wrap gap-3" },
                        catalogos.Carreras.map((c) =>
                          h(
                            "div",
                            { className: "flex items-center gap-2", key: c.nombre },
                            h("input", { type: "checkbox", className: "checkbox checkbox-sm", checked: (editForm.carreras || []).includes(c.nombre), onChange: () => toggleEnLista(setEditForm, editForm, "carreras", c.nombre) }),
                            h("label", { className: "text-sm" }, c.nombre)
                          )
                        )
                      )
                    : null,
                  esCarreras ? h("span", { className: "text-base-content/60 text-sm" }, "El ITR que dicta la carrera se asigna desde la pestaña ITRs.") : null,
                  esSimple
                    ? h("textarea", { className: "input input-bordered input-sm w-full border-neutral-800/30", rows: 2, placeholder: "Descripción", value: editForm.descripcion || "", onChange: (e) => setEditForm({ ...editForm, descripcion: e.target.value }) })
                    : null
                )
              : h(
                  Fragment,
                  null,
                  esGrupos ? h("span", { className: "text-sm" }, `Carrera: ${item.carrera} — Generación: ${item.generacion}`) : null,
                  esItrs
                    ? h(
                        "div",
                        { className: "flex flex-wrap gap-1" },
                        item.carreras.length ? item.carreras.map((c) => h("span", { className: "badge badge-outline", key: c }, c)) : h("span", { className: "text-base-content/60 text-sm" }, "Sin carreras asociadas")
                      )
                    : null,
                  esCarreras
                    ? h(

                        { className: "flex flex-wrap gap-1" },
                        (() => {

                          return itrs.length ? itrs.map((itr) => h("span", { className: "badge badge-outline", key: itr }, itr)) : h("span", { className: "text-base-content/60 text-sm" }, "Ningún ITR la dicta");
                        })()
                      )
                    : null,
                  esSimple ? h("span", { className: "text-base-content/60 text-sm" }, item.descripcion || "—") : null
                )
          ),
          h("td", null, h("span", { className: "badge " + ESTADO_BADGE[item.estado] }, ESTADO_LABEL[item.estado])),
          h(
            "td",
            null,
            esEdit
              ? h(
                  "div",
                  { className: "flex gap-2" },
                  h("button", { type: "button", className: "btn btn-primary btn-sm", onClick: () => guardarEdicion(i) }, "Guardar"),
                  h("button", { type: "button", className: "btn btn-outline btn-sm", onClick: () => setEditIndex(null) }, "Cancelar")
                )
              : h(
                  "div",
                  { className: "flex items-center gap-2" },
                  h("button", { type: "button", className: "btn btn-link btn-sm p-0 no-underline", onClick: () => empezarEdicion(i) }, "Editar"),
                  h(
                    "button",
                    {
                      type: "button",

      }),
    }),
    h(

      esGrupos
        ? h(

/* ---------------- Auditoría ---------------- */
// Los valores anterior/nuevo de auditoría vienen de columnas jsonb (postgres,
// .old/.new) — acá se parsean y se muestran como una tabla campo por campo en
// vez de JSON crudo, resaltando lo que cambió.
function parsearJson(str) {
  if (!str) return null;
  try {
    return JSON.parse(str);
  } catch (e) {
    return null;
  }
}

function DiffJson({ anterior, nuevo }) {
  const objAnterior = parsearJson(anterior) || {};
  const objNuevo = parsearJson(nuevo) || {};
  const claves = [...new Set([...Object.keys(objAnterior), ...Object.keys(objNuevo)])];

  if (!claves.length) return h("div", { className: "text-sm text-base-content/60" }, "Sin datos para mostrar.");

  return h(
    "table",
    { className: "table table-sm align-middle" },
    h("thead", null, h("tr", null, h("th", null, "Campo"), h("th", null, "Valor anterior"), h("th", null, "Valor nuevo"))),
    h(
      "tbody",
      null,
      claves.map((k) => {
        const tieneAnterior = Object.prototype.hasOwnProperty.call(objAnterior, k);
        const tieneNuevo = Object.prototype.hasOwnProperty.call(objNuevo, k);
        const va = tieneAnterior ? String(objAnterior[k]) : "—";
        const vn = tieneNuevo ? String(objNuevo[k]) : "—";
        const cambio = va !== vn;
        return h(
          "tr",
          { key: k },
          h("td", { className: "font-mono text-sm" }, k),
          h("td", { className: "font-mono text-sm" + (cambio && tieneAnterior ? " text-error" : " text-base-content/60") }, va),
          h("td", { className: "font-mono text-sm" + (cambio ? " text-success font-semibold" : "") }, vn)
        );
      })
    )
  );
}

/* ---------------- Reportes ---------------- */
// Arma algo parecido a ReporteResponseDTO a partir de los datos de la demo:
// totales reales, desglose de recordatorios por estado operativo, y detalle
// por estudiante — en vez de los 4 números fijos que había antes.
function generarReporte(desde, hasta, userName) {
  // Nota: las fechas de la demo están en formatos mixtos ("DD/MM HH:mm", ISO,
  // etc.) porque cada sección las guarda distinto, así que el filtro por
  // rango es solo ilustrativo acá — no filtra de verdad como haría la API.
  const instancias = INSTANCIAS;
  const incidencias = INCIDENCIAS;
  const recordatorios = RECORDATORIOS;

  const porEstudiante = {};
  STUDENTS.forEach((s) => {
    porEstudiante[s.nombre] = { idEstudiante: s.doc, nombreCompleto: s.nombre, documento: s.doc, cantidadInstancias: 0, cantidadIncidencias: 0, cantidadRecordatorios: 0 };
  });
  instancias.forEach((i) => { if (porEstudiante[i.estudiante]) porEstudiante[i.estudiante].cantidadInstancias++; });
  incidencias.forEach((i) => { if (porEstudiante[i.estudiante]) porEstudiante[i.estudiante].cantidadIncidencias++; });
  recordatorios.forEach((r) => {
    const inst = instancias.find((i) => i.id === r.codInstancia);
    if (inst && porEstudiante[inst.estudiante]) porEstudiante[inst.estudiante].cantidadRecordatorios++;
  });
  const detallePorEstudiante = Object.values(porEstudiante).filter((d) => d.cantidadInstancias || d.cantidadIncidencias || d.cantidadRecordatorios);

  return {
    fechaGeneracion: new Date(),
    generadoPor: userName,
    filtrosAplicados: desde || hasta ? `Desde ${desde || "—"} hasta ${hasta || "—"}` : "Sin filtros de fecha",
    desde,
    hasta,
    totalEstudiantes: STUDENTS.filter((s) => s.estado === "activo").length,
    totalInstancias: instancias.length,
    totalIncidencias: incidencias.length,
    totalRecordatorios: recordatorios.length,
    recordatoriosVencidos: recordatorios.filter((r) => estadoOperativoDe(r.fecha) === "vencido").length,
    recordatoriosHoy: recordatorios.filter((r) => estadoOperativoDe(r.fecha) === "hoy").length,
    recordatoriosFuturos: recordatorios.filter((r) => estadoOperativoDe(r.fecha) === "futuro").length,
    detallePorEstudiante,
  };
}

function ReportesSection({ userName }) {
  const [desde, setDesde] = useState("");
  const [hasta, setHasta] = useState("");
  const [exportado, setExportado] = useState(null); // nombre del PDF "generado", para simular la validación
  const [validacion, setValidacion] = useState(null); // { autentico, nombre }

  const reporte = generarReporte(desde, hasta, userName);

  function exportarPdf() {
    const nombre = `reporte_seguimiento_${Date.now()}.pdf`;
    const resumen = [
      `SIENEP: Reporte de seguimiento`,
      `Generado por: ${userName}`,
      `Fecha: ${reporte.fechaGeneracion.toLocaleString("es-UY")}`,
      `Filtros: ${reporte.filtrosAplicados}`,
      ``,
      `Estudiantes activos: ${reporte.totalEstudiantes}`,
      `Instancias: ${reporte.totalInstancias}`,
      `Incidencias: ${reporte.totalIncidencias}`,
      `Recordatorios: ${reporte.totalRecordatorios} (vencidos: ${reporte.recordatoriosVencidos}, hoy: ${reporte.recordatoriosHoy}, futuros: ${reporte.recordatoriosFuturos})`,
    ].join("\n");
    const blob = new Blob([resumen], { type: "application/pdf" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = nombre;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    setExportado(nombre);
  }

  function validarReporte(e) {
    const archivo = e.target.files[0];
    if (!archivo) return;
    // Simulación: en la API real esto compara un hash/firma contra lo que
    // generó SIENEP. Acá solo comparamos el nombre contra el último PDF que
    // exportamos en esta misma sesión, a falta de backend real.
    setValidacion({ autentico: exportado && archivo.name === exportado, nombre: archivo.name });
    e.target.value = "";
  }

  return h(
    "div",
    { className: "w-full px-4 py-4 max-w-[1040px]" },
    h(SectionHeader, { title: "Reportes", action: "Exportar PDF", onAction: exportarPdf }),
    exportado
      ? h(
          "div",
          { className: "alert alert-success text-sm flex justify-between items-center mb-3", role: "alert" },
          `PDF generado: ${exportado}`,
          h("button", { type: "button", className: "btn btn-sm btn-circle btn-ghost", "aria-label": "Cerrar", onClick: () => setExportado(null) }, "✕")
        )
      : null,

    h("div", { className: "text-sm text-base-content/60 mb-4" }, `Generado por ${reporte.generadoPor} el ${reporte.fechaGeneracion.toLocaleString("es-UY")}. ${reporte.filtrosAplicados}`),

    h(
      "div",
      { className: "grid grid-cols-12 gap-3 mb-3" },
      h("div", { className: "col-span-6 md:col-span-3" }, h("label", { className: "block text-sm font-medium mb-1" }, "Desde"), h("input", { type: "date", className: "input input-bordered input-sm w-full border-neutral-800/30", value: desde, onChange: (e) => setDesde(e.target.value) })),
      h("div", { className: "col-span-6 md:col-span-3" }, h("label", { className: "block text-sm font-medium mb-1" }, "Hasta"), h("input", { type: "date", className: "input input-bordered input-sm w-full border-neutral-800/30", value: hasta, onChange: (e) => setHasta(e.target.value) }))
    ),

    h(
      "div",
      { className: "grid grid-cols-12 gap-3 mb-3" },
      [
        { label: "Estudiantes activos", value: reporte.totalEstudiantes },
        { label: "Instancias", value: reporte.totalInstancias },
        { label: "Incidencias", value: reporte.totalIncidencias },
        { label: "Recordatorios", value: reporte.totalRecordatorios },
      ].map((s, i) =>
        h(
          "div",
          { className: "col-span-6 md:col-span-3", key: i },
          h("div", { className: "card bg-base-100 border border-base-content/20 h-full" }, h("div", { className: "card-body" }, h("div", { className: "text-3xl font-bold" }, s.value), h("div", { className: "text-base-content/60 text-sm" }, s.label)))
        )
      )
    ),

    h(FieldSetLabel, null, "Recordatorios por estado operativo"),
    h(
      "div",
      { className: "flex flex-wrap gap-3 mb-4" },
      h("span", { className: "badge " + ESTADO_OPERATIVO_BADGE.vencido }, `Vencidos: ${reporte.recordatoriosVencidos}`),
      h("span", { className: "badge " + ESTADO_OPERATIVO_BADGE.hoy }, `Hoy: ${reporte.recordatoriosHoy}`),
      h("span", { className: "badge " + ESTADO_OPERATIVO_BADGE.futuro }, `Futuros: ${reporte.recordatoriosFuturos}`)
    ),

    h(FieldSetLabel, null, "Detalle por estudiante"),
    reporte.detallePorEstudiante.length
      ? h(DataTable, {
          headers: ["Estudiante", "Documento", "Instancias", "Incidencias", "Recordatorios"],
          rows: reporte.detallePorEstudiante.map((d, i) =>
            h(
              "tr",
              { key: i },
              h("td", { className: "font-semibold" }, d.nombreCompleto),
              h("td", { className: "font-mono text-sm" }, d.documento),
              h("td", null, d.cantidadInstancias),
              h("td", null, d.cantidadIncidencias),
              h("td", null, d.cantidadRecordatorios)
            )
          ),
        })
      : h("p", { className: "text-base-content/60 text-sm" }, "Ningún estudiante tiene instancias, incidencias o recordatorios en este período."),

    h(FieldSetLabel, null, "Validar autenticidad de un reporte"),
    h("p", { className: "text-base-content/60 text-sm -mt-2 mb-2" }, "Subí un PDF exportado desde SIENEP para confirmar que es auténtico."),
    h("input", { type: "file", accept: "application/pdf", className: "file-input file-input-bordered file-input-sm w-full max-w-xs mb-2", onChange: validarReporte }),
    validacion
      ? h(
          "div",
          { className: "alert text-sm " + (validacion.autentico ? "alert-success" : "alert-error") },
          validacion.autentico ? `"${validacion.nombre}" es un reporte auténtico generado por SIENEP.` : `"${validacion.nombre}" no coincide con ningún reporte generado por SIENEP en esta sesión.`
        )
      : null
  );
}

/* ---------------- Vista de estudiante ---------------- */
function MiPerfilSection({ userName }) {
  const [s, setS] = useState(STUDENTS[0]);
  const [cambiandoPass, setCambiandoPass] = useState(false);
  const [passGuardada, setPassGuardada] = useState(false);
  const [actual, setActual] = useState("");
  const [nueva, setNueva] = useState("");
  const [confirmar, setConfirmar] = useState("");

  const [editandoDatos, setEditandoDatos] = useState(false);
  const [calle, setCalle] = useState(s.direccion.calle);
  const [nroPuerta, setNroPuerta] = useState(s.direccion.nroPuerta);
  const [ciudad, setCiudad] = useState(s.direccion.ciudad);
  const [departamento, setDepartamento] = useState(s.direccion.departamento);
  const [telefonos, setTelefonos] = useState(s.telefono && s.telefono !== "—" ? s.telefono.split(", ") : [""]);

  function handleSubmitPass(e) {
    e.preventDefault();
    setCambiandoPass(false);
    setPassGuardada(true);
    setActual("");
    setNueva("");
    setConfirmar("");
  }
  function updateTelefono(i, value) {
    const copy = telefonos.slice();
    copy[i] = value;
    setTelefonos(copy);
  }
  function empezarEdicionDatos() {
    setCalle(s.direccion.calle);
    setNroPuerta(s.direccion.nroPuerta);
    setCiudad(s.direccion.ciudad);
    setDepartamento(s.direccion.departamento);
    setTelefonos(s.telefono && s.telefono !== "—" ? s.telefono.split(", ") : [""]);
    setEditandoDatos(true);
  }
  function guardarDatos(e) {
    e.preventDefault();
    // PUT /estudiantes/{id}/mis-datos — el estudiante solo puede tocar su
    // dirección y teléfonos, no nombre/documento/email (eso lo edita un funcionario).
    setS({ ...s, direccion: { calle, nroPuerta, ciudad, departamento }, telefono: telefonos.filter(Boolean).join(", ") || "—" });
    setEditandoDatos(false);
  }
  function handleFoto(e) {
    const archivo = e.target.files[0];
    if (archivo) setS({ ...s, foto: URL.createObjectURL(archivo) });
  }

  return h(
    "div",
    { className: "max-w-[600px] mx-auto w-full px-4 py-4" },
    h(SectionHeader, { title: "Mi perfil" }),

    h(
      "div",
      { className: "flex items-center gap-4 mb-4" },
      s.foto
        ? h("img", { src: s.foto, className: "rounded-full object-cover w-[4.5rem] h-[4.5rem]" })
        : h(
            "span",
            { className: "w-[4.5rem] h-[4.5rem] text-xl rounded-full bg-primary/10 text-primary inline-flex items-center justify-center font-semibold" },
            userName.split(" ").map((p) => p[0]).slice(0, 2).join("")
          ),
      h(
        "div",
        null,
        h("label", { className: "btn btn-outline btn-sm", htmlFor: "foto-perfil" }, s.foto ? "Cambiar foto" : "Subir foto"),
        h("input", { id: "foto-perfil", type: "file", accept: "image/*", className: "hidden", onChange: handleFoto }),
        s.foto ? h("button", { type: "button", className: "btn btn-link btn-sm p-0 no-underline text-error block mt-1", onClick: () => setS({ ...s, foto: null }) }, "Quitar foto") : null
      )
    ),

    passGuardada ? h("div", { className: "alert alert-success text-sm mb-3" }, "Contraseña actualizada correctamente.") : null,

    h(Dl, {
      pairs: [
        ["Nombre", userName],
        ["Documento", h("span", { className: "font-mono" }, s.doc)],
        ["Email", s.email],
        ["Grupos", s.grupos.join(", ")],
        ["Carrera(s)", carrerasDe(s.grupos).join(", ") || "—"],
      ],
    }),

    h(FieldSetLabel, null, "Datos de contacto"),
    editandoDatos
      ? h(
          "form",
          { onSubmit: guardarDatos, className: "max-w-[460px]" },
          h(
            "div",
            { className: "grid grid-cols-12 gap-3 mb-2" },
            h("div", { className: "col-span-12 md:col-span-6" }, h("label", { className: "block text-sm font-medium mb-1" }, "Calle"), h("input", { className: "input input-bordered input-sm w-full border-neutral-800/30", value: calle, onChange: (e) => setCalle(e.target.value) })),
            h("div", { className: "col-span-12 md:col-span-2" }, h("label", { className: "block text-sm font-medium mb-1" }, "Número"), h("input", { className: "input input-bordered input-sm w-full border-neutral-800/30", value: nroPuerta, onChange: (e) => setNroPuerta(e.target.value) })),
            h("div", { className: "col-span-12 md:col-span-2" }, h("label", { className: "block text-sm font-medium mb-1" }, "Ciudad/Barrio"), h("input", { className: "input input-bordered input-sm w-full border-neutral-800/30", value: ciudad, onChange: (e) => setCiudad(e.target.value) })),
            h("div", { className: "col-span-12 md:col-span-2" }, h("label", { className: "block text-sm font-medium mb-1" }, "Departamento"), h("input", { className: "input input-bordered input-sm w-full border-neutral-800/30", value: departamento, onChange: (e) => setDepartamento(e.target.value) }))
          ),
          h("label", { className: "block text-sm font-medium mb-1" }, "Teléfonos"),
          telefonos.map((t, i) =>
            h(
              "div",
              { className: "join mb-2 max-w-[280px]", key: i },
              h("input", { className: "input input-bordered input-sm join-item w-full border-neutral-800/30", placeholder: "099123456", value: t, onChange: (e) => updateTelefono(i, e.target.value) }),
              telefonos.length > 1 ? h("button", { type: "button", className: "btn btn-outline btn-sm join-item", onClick: () => setTelefonos(telefonos.filter((_, idx) => idx !== i)) }, "×") : null
            )
          ),
          h("button", { type: "button", className: "btn btn-outline btn-primary btn-sm mb-3", onClick: () => setTelefonos(telefonos.concat("")) }, "+ Agregar teléfono"),
          h(
            "div",
            { className: "flex gap-2" },
            h("button", { type: "button", className: "btn btn-outline btn-sm", onClick: () => setEditandoDatos(false) }, "Cancelar"),
            h("button", { type: "submit", className: "btn btn-primary btn-sm" }, "Guardar")
          )
        )
      : h(
          Fragment,
          null,
          h(Dl, {
            pairs: [
              ["Dirección", formatearDireccion(s.direccion)],
              ["Teléfono", s.telefono],
            ],
          }),
          h("button", { type: "button", className: "btn btn-outline btn-primary btn-sm mb-4", onClick: empezarEdicionDatos }, "Editar datos de contacto")
        ),

    h(FieldSetLabel, null, "Seguridad"),
    cambiandoPass
      ? h(
          "form",
          { onSubmit: handleSubmitPass, className: "max-w-[380px]" },
          h(
            "div",
            { className: "mb-2" },
            h("label", { className: "block text-sm font-medium mb-1" }, "Contraseña actual"),
            h("input", { type: "password", className: "input input-bordered input-sm w-full border-neutral-800/30", required: true, value: actual, onChange: (e) => setActual(e.target.value) })
          ),
          h(
            "div",
            { className: "mb-2" },
            h("label", { className: "block text-sm font-medium mb-1" }, "Nueva contraseña"),
            h("input", { type: "password", className: "input input-bordered input-sm w-full border-neutral-800/30", required: true, value: nueva, onChange: (e) => setNueva(e.target.value) })
          ),
          h(
            "div",
            { className: "mb-3" },
            h("label", { className: "block text-sm font-medium mb-1" }, "Confirmar nueva contraseña"),
            h("input", { type: "password", className: "input input-bordered input-sm w-full border-neutral-800/30", required: true, value: confirmar, onChange: (e) => setConfirmar(e.target.value) })
          ),
          h(
            "div",
            { className: "flex gap-2" },
            h("button", { type: "button", className: "btn btn-outline btn-sm", onClick: () => setCambiandoPass(false) }, "Cancelar"),
            h("button", { type: "submit", className: "btn btn-primary btn-sm" }, "Guardar")
          )
        )
      : h(
          "button",
          {
            type: "button",
            className: "btn btn-outline btn-primary btn-sm",
            onClick: () => {
              setCambiandoPass(true);
              setPassGuardada(false);
            },
          },
          "Cambiar contraseña"
        )
  );
}

function MisSection({ tipo }) {
  const data = tipo === "instancias" ? INSTANCIAS.filter((i) => i.estudiante === "Ariana Bentancur") : INCIDENCIAS.filter((i) => i.estudiante === "Ariana Bentancur");
  const title = tipo === "instancias" ? "Mis instancias" : "Mis incidencias";
  const [detalle, setDetalle] = useState(null);

  if (detalle) {
    return h(
      "div",
      { className: "max-w-[600px] mx-auto w-full px-4 py-4" },
      h(BackButton, { onClick: () => setDetalle(null), label: "Volver a " + title.toLowerCase() }),
      h("h1", { className: "text-xl font-bold mb-3" }, tipo === "instancias" ? detalle.categoria : detalle.titulo),
      h(Dl, {
        pairs:
          tipo === "instancias"
            ? [
                ["Fecha", detalle.fecha],
                ["Categoría", detalle.categoria],
                ["Canal", detalle.canal],
                ["Responsable", detalle.responsable],
                ["Estado", h("span", { className: "badge " + ESTADO_BADGE[detalle.estado] }, ESTADO_LABEL[detalle.estado])],
              ]
            : [
                ["Fecha", detalle.fecha],
                ["Lugar", detalle.lugar],
                ["Responsable", detalle.responsable],
                ["Estado", h("span", { className: "badge " + ESTADO_BADGE[detalle.estado] }, ESTADO_LABEL[detalle.estado])],
              ],
      }),
      detalle.comentarios && detalle.comentarios.length
        ? h(
            Fragment,
            null,
            h(FieldSetLabel, null, "Comentarios"),
            h(
              "ul",
              { className: "divide-y divide-base-300" },
              detalle.comentarios.map((c, i) =>
                h(
                  "li",
                  { className: "py-2", key: i },
                  h("div", { className: "flex justify-between" }, h("span", { className: "font-semibold text-sm" }, c.autor), h("span", { className: "text-base-content/60 text-sm" }, c.fecha)),
                  h("div", { className: "text-sm" }, c.texto)
                )
              )
            )
          )
        : null
    );
  }

  return h(
    "div",
    { className: "max-w-[700px] mx-auto w-full px-4 py-4" },
    h(SectionHeader, { title }),
    data.length
      ? h(
          "ul",
          { className: "border border-base-300 rounded-box divide-y divide-base-300" },
          data.map((it, i) =>
            h(
              "li",
              { className: "p-3 flex justify-between items-center", key: i },
              h("button", { type: "button", className: "btn btn-link btn-sm p-0 no-underline text-left", onClick: () => setDetalle(it) }, tipo === "instancias" ? `${it.categoria} — ${it.fecha}` : it.titulo),
              h("span", { className: "badge " + ESTADO_BADGE[it.estado] }, ESTADO_LABEL[it.estado])
            )
          )
        )
      : h("p", { className: "text-base-content/60" }, "No tenés nada registrado por el momento.")
  );
}

function SectionContent({ active, userName, misPermisos }) {
  if (active === "estudiantes") return h(EstudiantesSection, { misPermisos });
  if (active === "instancias") return h(InstanciasSection, { misPermisos });
  if (active === "incidencias") return h(IncidenciasSection);
  if (active === "recordatorios") return h(RecordatoriosSection);
  if (active === "funcionarios") return h(FuncionariosSection, { misPermisos });
  if (active === "roles") return h(RolesSection, { misPermisos });
  if (active === "catalogos") return h(CatalogosSection);
  if (active === "auditoria") return h(AuditoriaSection);
  if (active === "reportes") return h(ReportesSection, { userName });
  if (active === "perfil") return h(MiPerfilSection, { userName });
  if (active === "mis-instancias") return h(MisSection, { tipo: "instancias" });
  if (active === "mis-incidencias") return h(MisSection, { tipo: "incidencias" });
  return null;
}

function App() {
  const [authView, setAuthView] = useState("login"); // "login" | "password" | "reset-password" | null (logueado)
  const [persona, setPersona] = useState("estudiante");
  const [view, setView] = useState("home");
  const [active, setActive] = useState(null);
  const [showSidebar, setShowSidebar] = useState(false);

  const userName = persona === "estudiante" ? "Ariana Bentancur" : "Carla Solís";
  const userRole = persona === "estudiante" ? "Estudiante" : "Administrador";
  // Permisos del funcionario de la demo: administrador, o sea acceso total.
  const misPermisos = ROLES.find((r) => r.nombre === "ADMINISTRADOR").permisos;

  function handlePersona(p) {
    setPersona(p);
    setView("home");
    setActive(null);
    setShowSidebar(false);
  }
  function handleNavigate(key) {
    setActive(key);
    setView("section");
  }
  function handleHome() {
    setView("home");
    setActive(null);
    setShowSidebar(false);
  }
  // En el sistema real esto invalidaría la sesión — acá simplemente volvemos
  // a la pantalla de login y reseteamos la navegación interna.
  function handleLogout() {
    setAuthView("login");
    setView("home");
    setActive(null);
    setShowSidebar(false);
  }

  if (authView === "login") return h(LoginScreen, { onLogin: () => setAuthView(null), onForgot: () => setAuthView("password") });
  if (authView === "password") return h(PasswordScreen, { onBack: () => setAuthView("login"), onSubmit: () => setAuthView("reset-password") });
  if (authView === "reset-password") return h(RestablecerContraseniaScreen, { onDone: () => setAuthView("login") });

  let content;
  if (view === "home") {
    content = h(Launcher, { persona, userName, onNavigate: handleNavigate });
  } else if (persona === "estudiante") {
    content = h(
      "div",
      { className: "grow overflow-auto" },
      h(
        "div",
        { className: "max-w-[760px] mx-auto w-full px-4 pt-4" },
        h(BackButton, { onClick: handleHome })
      ),
      h(SectionContent, { active, userName })
    );
  } else {
    content = h(
      "div",
      { className: "flex grow min-h-0" },
      h(Sidebar, { active, onNavigate: handleNavigate, onHome: handleHome, show: showSidebar, onClose: () => setShowSidebar(false) }),
      h(
        "div",
        { className: "grow overflow-auto flex flex-col" },
        h(
          "div",
          { className: "md:hidden border-b border-base-300 p-2 flex items-center gap-2 bg-base-200 shrink-0" },
          h("button", { type: "button", className: "btn btn-outline btn-sm inline-flex items-center gap-1", onClick: () => setShowSidebar(true) }, h(Icon, { path: ICONS.list, size: 15 }), "Menú"),
          h("span", { className: "font-semibold text-sm" }, (SECTION_META[active] || {}).title)
        ),
        h(SectionContent, { active, userName, misPermisos })
      )
    );
  }

  return h("div", { className: "flex flex-col h-screen" }, h(TopBar, { persona, setPersona: handlePersona, userName, userRole, onLogout: handleLogout }), content);
}

ReactDOM.createRoot(document.getElementById("root")).render(h(App));
    </script>
  </body>
</html>
